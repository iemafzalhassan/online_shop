apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-shop-deployment
  namespace: online-shop-ns
  labels:
    app: online-shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-shop

  template:
    metadata:
      name: online-shop-pod
      namespace: online-shop
      labels:
        app: online-shop

    spec:
      containers:
      - name: online-shop
        image: shiv2bhargava/online-shops
        ports:
        - containerPort: 5173 

  

