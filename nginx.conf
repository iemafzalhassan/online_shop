server {
    listen 8080;        # The container will listen on port 8080
    listen 8443;        # Allows traffic on 8443 but does NOT enforce SSL
    http2 on;           # Enable HTTP/2
    server_name _;      # Accept requests from any domain/IP

    location / {
        root /usr/share/nginx/html;     # Serve files from the React build directory
        index index.html;               # Default file to load
        try_files $uri /index.html;     # Always serve index.html for React routing (prevents 404s on refresh)
    }

    # Security headers
    add_header X-Frame-Options DENY;                # Prevents clickjacking attacks
    add_header X-Content-Type-Options nosniff;      # Prevents MIME-type sniffing
    add_header X-XSS-Protection "1; mode=block";    # Enables basic XSS protection

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
