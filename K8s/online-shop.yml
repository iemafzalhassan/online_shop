kind: Deployment
apiVersion: apps/v1
metadata:
  name: online-shop
  namespace: nginx-ns
  labels:
    app: online-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-shop
  template:
    metadata:
      labels:
        app: online-shop
    spec:
      containers:
        - name: online-shop
          image: varpriya/online-shop:latest
          ports:
            - containerPort: 5173

